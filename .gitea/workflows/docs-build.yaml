name: Build docs

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: node:24-bookworm
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install dependencies
        run: npm ci
      - name: Build documentation
        run: npm run build
